      align-items: center;

      font-size: 18px;

      color: var(--bg-dark);
      flex-shrink: 0;

    .chat-header .group-info {

    .chat-header .group-name {

    .chat-header .header-actions {

      left: 50%;

      width: 400px;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }
    .toast.hide {
      transform: translateX(-50%) translateY(120px);
      opacity: 0;
      visibility: hidden;
    }
    .toast.success {
      background: #0D2A1F;
      border: 1px solid #2D7D5A;
      color: #2D7D5A;
    }
    .toast.error {

      color: #8A3A3A;
    }
    .toast.warning {

      border: 1px solid #B8860B;
      color: #B8860B;
    }
    .toast.info {
      background: #0D1A2A;
      border: 1px solid #4A7A8A;
      color: #4A7A8A;

      .messages-container { padding: 8px 10px 4px; }

    }
  </style>
</head>

// ================================================================
// TOAST CORRIGÉ
// ================================================================
function showToast(message, type = 'info') {
  if (toastTimer) {
    clearTimeout(toastTimer);
    toastTimer = null;
  }
  toast.classList.remove('show', 'hide');
  void toast.offsetWidth;
  toast.textContent = message;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => toast.classList.add('show'));
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
    toast.classList.add('hide');
    toastTimer = null;
  }, 3500);
  toast.onclick = () => {
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    toast.classList.remove('show');
    toast.classList.add('hide');
  };
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getInitials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

// ================================================================
// COMPRESSER L'IMAGE
// ================================================================
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject('Le fichier n\'est pas une image');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      reject('L\'image est trop lourde (max 10MB)');
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 800;
        let width = img.width;
        let height = img.height;
        if (width > maxSize || height > maxSize) {
          if (width > height) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const quality = 0.7;
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve(base64);
      };
      img.onerror = () => reject('Erreur de chargement de l\'image');
      img.src = event.target.result;
    };
    reader.onerror = () => reject('Erreur de lecture du fichier');
    reader.readAsDataURL(file);
  });
}

// ✅ Déclarer updateNotifIcon AVANT de l'utiliser
function updateNotifIcon() {

  if (notificationsEnabled) {
    notifIcon.className = 'fas fa-bell';
    notifBtn.classList.add('active');
  } else {

    notifBtn.classList.remove('active');

async function setupNotifications() {
  if (!currentUser) return;

  try {
    // Vérifier si Notification existe
    if (typeof Notification === 'undefined') {
      console.warn('⚠️ Notification API non disponible');
      notificationsEnabled = false;
      updateNotifIcon();
      return;
    }

    // Demander la permission
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      notificationsEnabled = false;
      updateNotifIcon();
      showToast('⚠️ Permissions de notification refusées', 'warning');
      return;
    }

    // Générer le token
    const token = await getToken(messaging, { vapidKey: VAPID_KEY });
    fcmToken = token;
    
    // Stocker dans Firestore
    const userRef = doc(db, 'users', currentUser.uid);
    await updateDoc(userRef, { 
      fcmToken: token,
      notificationsEnabled: true
    });
    
    notificationsEnabled = true;
    updateNotifIcon();
    console.debug('✅ FCM Token:', token.substring(0, 20) + '...');

    // Écouter les messages en avant-plan
    onMessage(messaging, (payload) => {
      console.debug('📩 Message reçu en avant-plan:', payload);
      const title = payload.notification?.title || 'ARVEXA';
      const body = payload.notification?.body || 'Nouveau message';
      showToast(`🔔 ${title}: ${body}`, 'info');
      
      // Recharger les messages
      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
        listenMessages();
      }
    });

  } catch (error) {
    console.error('❌ Erreur setup notifications:', error);
    notificationsEnabled = false;
    updateNotifIcon();
    if (error.code === 'messaging/permission-blocked') {
      showToast('⚠️ Les notifications sont bloquées par votre navigateur', 'warning');
    }
  }
}

async function disableNotifications() {
  if (!currentUser) return;

  try {
    if (fcmToken) {
      await deleteToken(messaging);
    }
    
    const userRef = doc(db, 'users', currentUser.uid);
    await updateDoc(userRef, { 
      fcmToken: null,
      notificationsEnabled: false
    });
    
    notificationsEnabled = false;
    fcmToken = null;
    updateNotifIcon();
    showToast('🔕 Notifications désactivées', 'warning');
    
  } catch (error) {
    console.error('❌ Erreur désactivation notifications:', error);
    showToast('❌ Erreur lors de la désactivation', 'error');
  }
}

async function toggleNotifications() {
  if (notificationsEnabled) {
    await disableNotifications();
  } else {
    await setupNotifications();
  }
}

// ================================================================
// AFFICHER LES MESSAGES
// ================================================================
function renderMessages(messages) {
  if (!messages || messages.length === 0) {
    messagesContainer.innerHTML = `
      <div class="messages-empty">
        <i class="fas fa-comments"></i>
        <div class="empty-title">Aucun message</div>
        <div class="empty-sub">Soyez le premier à écrire !</div>
      </div>
    `;
    return;
  }
  
  let html = '';
  let lastDate = '';
  
  messages.forEach((msg, index) => {
    const isMe = currentUser && msg.userId === currentUser.uid;
    const msgTime = formatTime(msg.timestamp);
    const senderName = msg.userName || 'Utilisateur';
    const avatarUrl = msg.userAvatar || '';
    const initial = getInitials(senderName);
    
    const isImage = msg.type === 'image' || (msg.message && msg.message.startsWith('data:image'));
    const avatarStyle = avatarUrl ? `background-image:url('${avatarUrl}');background-size:cover;` : '';
    
    let contentHtml = '';
    if (isImage) {
      contentHtml = `
        <img src="${escapeHtml(msg.message)}" class="msg-image" loading="lazy" 
             onclick="window.open('${escapeHtml(msg.message)}', '_blank')"
             alt="Image partagée">
      `;
    } else {
      contentHtml = escapeHtml(msg.message);
    }
    
    html += `
      <div class="message-wrapper ${isMe ? 'me' : 'other'}">
        ${!isMe ? `
        <div class="message-sender">
          <div class="avatar-small" style="${avatarStyle}">${avatarStyle ? '' : initial}</div>
          <span class="sender-name">${escapeHtml(senderName)}</span>
        </div>
        ` : ''}
        <div class="message-bubble">
          ${contentHtml}
          <span class="msg-time">${msgTime}</span>
        </div>
      </div>
    `;
  });
  
  messagesContainer.innerHTML = html;
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  });
}

// ================================================================
// ÉCOUTER LES MESSAGES
// ================================================================
function listenMessages() {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }
  
  const q = query(collection(db, 'messages_groupe'), orderBy('timestamp', 'asc'));
  let isFirstLoad = true;
  
  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    const messages = [];
    snapshot.forEach((doc) => {
      messages.push({ id: doc.id, ...doc.data() });
    });
    renderMessages(messages);
    
    if (isFirstLoad) {
      isFirstLoad = false;
      scrollToBottom();
    } else {
      const isNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;
      if (isNearBottom) scrollToBottom();
    }
  }, (error) => {
    console.error('Erreur écoute messages:', error);
    showToast('❌ Erreur de chargement des messages', 'error');
  });
}
