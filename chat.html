<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Assistant IA Multimodal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --whatsapp-bubble-other: rgba(255, 255, 255, 0.05);
      --whatsapp-bubble-me: rgba(184, 134, 11, 0.15);
      --header-height: 60px;
      --sidebar-width: 300px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased;
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.08) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    /* ============================================================
       SIDEBAR (STYLE CHATGPT)
       ============================================================ */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      max-width: 85vw;
      height: 100%;
      background: rgba(10, 10, 10, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(184, 134, 11, 0.06);
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      overflow-y: auto;
      box-shadow: 4px 0 40px rgba(0, 0, 0, 0.3);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(184, 134, 11, 0.06);
      margin-bottom: 12px;
    }
    .sidebar-header .logo {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      letter-spacing: 2px;
    }
    .sidebar-header .logo span { color: var(--accent); font-style: italic; }
    .sidebar-header .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .sidebar-header .close-btn:active { transform: scale(0.92); }
    .sidebar-header .close-btn:hover { color: var(--text-light); background: rgba(255,255,255,0.06); }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(184, 134, 11, 0.06);
      border: 1px solid rgba(184, 134, 11, 0.08);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      width: 100%;
      margin-bottom: 14px;
    }
    .new-chat-btn:active { transform: scale(0.96); }
    .new-chat-btn:hover { background: rgba(184, 134, 11, 0.10); }
    .new-chat-btn i { font-size: 16px; }

    .history-title {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      opacity: 0.4;
      padding: 0 4px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
    }
    .chat-list::-webkit-scrollbar { width: 2px; }
    .chat-list::-webkit-scrollbar-track { background: transparent; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 13px;
    }
    .chat-item:active { transform: scale(0.96); }
    .chat-item:hover { background: rgba(255,255,255,0.03); color: var(--text-light); }
    .chat-item.active { background: rgba(184, 134, 11, 0.06); color: var(--accent); }
    .chat-item i { font-size: 14px; color: var(--accent); flex-shrink: 0; }
    .chat-item .chat-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .chat-delete {
      color: var(--text-dim);
      opacity: 0.2;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition);
      padding: 4px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .chat-item .chat-delete:hover { opacity: 1; color: var(--danger); }

    .sidebar-footer {
      padding-top: 12px;
      border-top: 1px solid rgba(184, 134, 11, 0.06);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      transition: var(--transition);
      cursor: pointer;
    }
    .sidebar-footer a:active { transform: scale(0.96); }
    .sidebar-footer a:hover { background: rgba(255,255,255,0.03); color: var(--text-light); }
    .sidebar-footer a i { font-size: 16px; color: var(--accent); width: 20px; text-align: center; }
    .sidebar-footer .logout-btn { color: #7A4A4A; }
    .sidebar-footer .logout-btn i { color: #7A4A4A; }
    .sidebar-footer .logout-btn:hover { background: rgba(122,74,74,0.06); }

    /* ============================================================
       OVERLAY
       ============================================================ */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 3, 5, 0.5);
      backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .sidebar-overlay.show { opacity: 1; visibility: visible; }

    /* ============================================================
       MODALE DÉCONNEXION
       ============================================================ */
    .modal-overlay-confirm {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 3000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay-confirm.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-confirm {
      background: var(--bg-surface);
      border: 1px solid rgba(184, 134, 11, 0.12);
      border-radius: var(--radius);
      padding: 24px 20px 20px;
      max-width: 300px;
      width: 100%;
      text-align: center;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-overlay-confirm.show .modal-confirm {
      transform: scale(1) translateY(0);
    }

    .modal-confirm .icon {
      font-size: 32px;
      color: var(--danger);
      opacity: 0.3;
      display: block;
      margin-bottom: 8px;
    }
    .modal-confirm h3 {
      font-size: 17px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .modal-confirm h3 span {
      color: var(--accent);
      font-style: italic;
    }
    .modal-confirm p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 2px;
    }
    .modal-confirm .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .modal-confirm .buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .modal-confirm .buttons .btn-cancel {
      flex: 1;
      padding: 8px 12px;
      max-width: 120px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    .modal-confirm .buttons .btn-cancel:active { transform: scale(0.96); }
    .modal-confirm .buttons .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-light);
    }
    .modal-confirm .buttons .btn-confirm {
      flex: 1;
      padding: 8px 12px;
      max-width: 120px;
      background: var(--danger);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }
    .modal-confirm .buttons .btn-confirm:active { transform: scale(0.96); }
    .modal-confirm .buttons .btn-confirm:hover { background: #6A2A2A; }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .chat-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
      flex-shrink: 0;
      gap: 10px;
      min-height: var(--header-height);
      position: relative;
      z-index: 10;
    }

    .chat-header .menu-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(184, 134, 11, 0.06);
      background: var(--glass-bg);
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .chat-header .menu-toggle:active { transform: scale(0.92); }
    .chat-header .menu-toggle:hover { border-color: rgba(184, 134, 11, 0.12); }

    .chat-header .ia-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9A7209);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--bg-dark);
      flex-shrink: 0;
      border: 2px solid rgba(184, 134, 11, 0.15);
      overflow: hidden;
      pointer-events: none;
    }
    .chat-header .ia-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .chat-header .ia-info {
      flex: 1;
      min-width: 0;
    }
    .chat-header .ia-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-light);
      line-height: 1.2;
      font-family: 'Playfair Display', serif;
    }
    .chat-header .ia-name span {
      color: var(--accent);
      font-style: italic;
    }
    .chat-header .ia-status {
      font-size: 11px;
      color: var(--text-muted);
    }
    .chat-header .ia-status .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
      background: var(--success);
    }

    .chat-header .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .chat-header .header-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .chat-header .header-btn:active { transform: scale(0.92); }
    .chat-header .header-btn:hover { color: var(--text-light); }

    /* ============================================================
       CHAT CONTAINER
       ============================================================ */
    .chat-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 0 0;
      width: 100%;
      overflow: hidden;
    }
    
        /* ============================================================
       MESSAGES
       ============================================================ */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .messages-container::-webkit-scrollbar {
      width: 3px;
    }
    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(184, 134, 11, 0.2);
      border-radius: 4px;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: messageSlideIn 0.25s ease-out;
    }
    .message-wrapper.ia { align-self: flex-start; }
    .message-wrapper.user { align-self: flex-end; }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message-wrapper .message-sender {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      margin: 0 4px 2px 4px;
    }
    .message-wrapper .message-sender .avatar-small {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 600;
      color: var(--bg-dark);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }
    .message-wrapper.user .message-sender { display: none; }

    .message-bubble {
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: break-word;
      position: relative;
      border: 1px solid transparent;
    }
    .message-wrapper.ia .message-bubble {
      background: var(--whatsapp-bubble-other);
      border-color: rgba(255, 255, 255, 0.04);
      border-bottom-left-radius: 4px;
    }
    .message-wrapper.user .message-bubble {
      background: var(--whatsapp-bubble-me);
      border-color: rgba(184, 134, 11, 0.10);
      border-bottom-right-radius: 4px;
    }

    .message-bubble .msg-time {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
      text-align: right;
      opacity: 0.6;
    }
    .message-wrapper.user .message-bubble .msg-time {
      color: var(--accent);
    }

    .message-bubble .msg-image {
      max-width: 200px;
      max-height: 280px;
      border-radius: 12px;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
      transition: transform 0.2s ease;
      pointer-events: auto;
    }
    .message-bubble .msg-image:active {
      transform: scale(0.97);
    }

    .message-bubble .model-badge {
      font-size: 9px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 4px;
      opacity: 0.6;
    }

    /* ============================================================
       IMAGE MODAL
       ============================================================ */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      padding: 20px;
    }
    .image-modal.show {
      opacity: 1;
      visibility: visible;
    }
    .image-modal img {
      max-width: 90%;
      max-height: 85%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .image-modal.show img {
      transform: scale(1);
    }
    .image-modal .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s ease;
    }
    .image-modal .close-modal:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-light);
    }

    .typing-indicator {
      align-self: flex-start;
      background: var(--whatsapp-bubble-other);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 10px 16px;
      display: none;
      gap: 4px;
      border-bottom-left-radius: 4px;
    }
    .typing-indicator.show { display: flex; }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingDot 1.4s ease-in-out infinite both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0s; }
    @keyframes typingDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .messages-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 20px;
    }
    .messages-empty i {
      font-size: 48px;
      opacity: 0.15;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .messages-empty .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .messages-empty .empty-sub {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 4px;
    }

    /* ============================================================
       INPUT
       ============================================================ */
    .chat-input-wrapper {
      flex-shrink: 0;
      padding: 6px 12px 10px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(184, 134, 11, 0.04);
    }

    .chat-input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-radius: 24px;
      padding: 4px 4px 4px 16px;
      transition: border-color 0.2s;
    }
    .chat-input-area:focus-within {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }

    .chat-input-area textarea {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 20px;
      max-height: 100px;
      line-height: 1.5;
      overflow-y: auto;
    }
    .chat-input-area textarea::placeholder {

function cleanAndFormatResponse(text) {
  if (!text) return '';

  let cleaned = text.replace(/\s+/g, ' ');
  
  // Ajouter des sauts de ligne après les nombres suivis d'un point
  cleaned = cleaned.replace(/(\d+)\.\s*/g, '\n\n$1. ');
  
  // Ajouter des sauts de ligne après les puces
  cleaned = cleaned.replace(/([•\-*])\s*/g, '\n$1 ');
  
  // Ajouter des sauts de ligne après les titres en gras
  cleaned = cleaned.replace(/\*\*(.*?)\*\*/g, '\n\n**$1**');
  
  // Séparer les paragraphes
  cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
  
  cleaned = cleaned.trim();
  return cleaned;
}

// ================================================================
// COMPRESSER L'IMAGE

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject('Le fichier n\'est pas une image');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      reject('L\'image est trop lourde (max 10MB)');
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 800;
        let width = img.width;
        let height = img.height;
        if (width > maxSize || height > maxSize) {
          if (width > height) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const quality = 0.7;
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve(base64);
      };
      img.onerror = () => reject('Erreur de chargement de l\'image');
      img.src = event.target.result;
    };
    reader.onerror = () => reject('Erreur de lecture du fichier');
    reader.readAsDataURL(file);
  });
}

async function callAllApis(userMessage, imageBase64) {
  const promises = [];
  const results = {};

  const messages = [

    ...conversationHistory.map(msg => ({
      role: msg.sender === 'user' ? 'user' : 'assistant',

  // Mistral

    callMistral(messages, imageBase64)
      .then(res => { results.mistral = res; return res; })
      .catch(err => { results.mistral = { error: err.message }; return null; })
  );

  // Groq
  promises.push(
    callGroq(messages)
      .then(res => { results.groq = res; return res; })
      .catch(err => { results.groq = { error: err.message }; return null; })
  );

  // OpenRouter
  promises.push(
    callOpenRouter(messages)
      .then(res => { results.openrouter = res; return res; })
      .catch(err => { results.openrouter = { error: err.message }; return null; })
  );

  await Promise.all(promises);
  return results;
}

// ================================================================
// APPEL MISTRAL AI
// ================================================================
async function callMistral(messages, imageBase64) {
  const api = APIS.mistral;
  
  let content = [];
  const lastMessage = messages[messages.length - 1];
  content.push({ type: 'text', text: lastMessage.content });

  if (imageBase64) {
    content.push({
      type: 'image_url',
      image_url: imageBase64
    });
  }

  const body = {
    model: api.model,
    messages: [
      { role: 'system', content: SYSTEM_PROMPT },
      ...messages.slice(0, -1),
      { role: 'user', content: content }
    ],
    temperature: 0.7,
    max_tokens: 2000
  };

  const response = await fetch(api.url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${api.key}`
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const error = await response.text();
    throw new Error(`Mistral error: ${response.status} - ${error}`);
  }

  const data = await response.json();
  let contentText = data.choices[0]?.message?.content || 'Je n\'ai pas de réponse pour le moment.';
  return cleanAndFormatResponse(contentText);
}

// ================================================================

// ================================================================
function selectBestResponse(results) {
  const responses = [];
  
  for (const [name, result] of Object.entries(results)) {
    if (result && !result.error) {
      responses.push({
        api: name,
        text: result,
        length: result.length,
        wordCount: result.split(' ').length,
        icon: APIS[name]?.icon || '🤖'
      });
    }
  }

  if (responses.length === 0) {
    return {
      text: 'Je n\'ai pas pu obtenir de réponse. Veuillez réessayer.',
      model: 'Erreur',
      icon: '❌'
    };
  }

  responses.sort((a, b) => b.wordCount - a.wordCount);
  const best = responses[0];

  return {
    text: best.text,
    model: APIS[best.api]?.name || best.api,
    icon: best.icon
  };
}

// RÉPONDRE AVEC LES 3 API
// ================================================================
async function getResponse(text, imageBase64) {
  try {
    const results = await callAllApis(text, imageBase64);
    const best = selectBestResponse(results);
    return {
      text: best.text,
      model: best.model,
      icon: best.icon
    };
  } catch (error) {
    console.error('Erreur appel API:', error);
    return {
      text: 'Désolé, je rencontre une difficulté technique. Veuillez réessayer.',
      model: 'Erreur',
      icon: '❌'
    };
  }
}

// ================================================================
// AFFICHER UN MESSAGE
// ================================================================
function addMessage(text, sender, time, modelInfo) {
  const div = document.createElement('div');
  div.className = `message-wrapper ${sender}`;

  const isImage = text && text.startsWith('data:image');
  const timeStr = time || formatTime();

  let contentHtml = '';
  if (isImage) {
    contentHtml = `
      <img src="${escapeHtml(text)}" class="msg-image" loading="lazy" 
           onclick="event.stopPropagation(); openImageModal('${escapeHtml(text)}')"
           alt="Image partagée">
    `;
  } else {
    contentHtml = escapeHtml(text).replace(/\n/g, '<br>');
  }

  let modelBadge = '';
  if (sender === 'ia' && modelInfo && modelInfo.model && modelInfo.model !== 'Erreur') {
    modelBadge = `<span class="model-badge">${modelInfo.icon || '🤖'} ${modelInfo.model}</span>`;
  }

  const avatarContent = sender === 'ia' ? '🤖' : '';
  const avatarStyle = sender === 'ia' ? 'background:linear-gradient(135deg,var(--accent),#9A7209);' : 'background:var(--accent);';

  div.innerHTML = `
    ${sender === 'ia' ? `
    <div class="message-sender">
      <div class="avatar-small" style="${avatarStyle}">${avatarContent}</div>
      <span>Assistant ARVEXA</span>
    </div>
    ` : ''}
    <div class="message-bubble">
      ${contentHtml}
      ${modelBadge}
      <span class="msg-time">${timeStr}</span>
    </div>
  `;

  messagesContainer.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  });
}

// ================================================================
// ENVOYER UN MESSAGE
// ================================================================
let pendingImage = null;

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text && !pendingImage) return;

  const timeStr = formatTime();
  let imageToSend = pendingImage;
  pendingImage = null;

  if (text) {
    addMessage(text, 'user', timeStr);
    conversationHistory.push({ sender: 'user', text });
  }

  if (imageToSend) {
    addMessage(imageToSend, 'user', timeStr);
    conversationHistory.push({ sender: 'user', text: '[Image envoyée]' });
  }

  messageInput.value = '';
  messageInput.style.height = 'auto';
  messageInput.focus();

  if (currentChatId) {
    try {
      const chatRef = doc(db, 'ia_chats', currentChatId);
      const chatSnap = await getDoc(chatRef);
      if (chatSnap.exists()) {
        const chat = chatSnap.data();
        const messages = [...(chat.messages || []), { 
          sender: 'user', 
          text: text || '[Image envoyée]',
          image: imageToSend || null,
          time: timeStr 
        }];
        const name = messages.length === 1 ? (text || 'Image').substring(0, 30) + (text && text.length > 30 ? '...' : '') : chat.name;
        await updateDoc(chatRef, { messages, name, updatedAt: new Date().toISOString() });
      }
    } catch (error) {
      console.error('Erreur sauvegarde message:', error);
    }
  }

  typingIndicator.classList.add('show');
  scrollToBottom();

  setTimeout(async () => {
    const response = await getResponse(text, imageToSend);
    const responseTime = formatTime();

    typingIndicator.classList.remove('show');

    addMessage(response.text, 'ia', responseTime, { model: response.model, icon: response.icon });
    conversationHistory.push({ sender: 'ia', text: response.text });

    if (currentChatId) {
      try {
        const chatRef2 = doc(db, 'ia_chats', currentChatId);
        const chatSnap2 = await getDoc(chatRef2);
        if (chatSnap2.exists()) {
          const chat = chatSnap2.data();
          const messages = [...(chat.messages || []), { 
            sender: 'ia', 
            text: response.text,
            model: response.model || 'Assistant',
            time: responseTime 
          }];
          await updateDoc(chatRef2, { messages, updatedAt: new Date().toISOString() });
        }
      } catch (error) {
        console.error('Erreur sauvegarde réponse:', error);
      }
    }

    scrollToBottom();
    renderChatList();
  }, 800 + Math.random() * 400);
}

attachBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showToast('📤 Compression de l\'image...', 'info');
  try {
    const base64 = await compressImage(file);
    pendingImage = base64;
    await sendMessage();
  } catch (error) {
    showToast('❌ ' + error, 'error');
  }
  imageInput.value = '';
});

// ================================================================
// GESTION DES DISCUSSIONS
// ================================================================
function getChatsCache() {
  try { return JSON.parse(localStorage.getItem(`arvexa_chats_${currentUser?.uid}`) || '[]'); } catch { return []; }
}

function saveChatsCache(chats) {
  try { localStorage.setItem(`arvexa_chats_${currentUser?.uid}`, JSON.stringify(chats)); } catch (e) {}
}

function listenChats() {
  if (!currentUser) return;
  if (unsubscribeChats) {
    unsubscribeChats();
    unsubscribeChats = null;
  }

  const q = query(collection(db, 'ia_chats'), where('userId', '==', currentUser.uid));

  unsubscribeChats = onSnapshot(q, (snapshot) => {
    const chats = [];
    snapshot.forEach(doc => chats.push({ id: doc.id, ...doc.data() }));
    chats.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    allChats = chats;
    saveChatsCache(chats);
    renderChatList();
  }, (error) => {
    console.error('Erreur écoute discussions:', error);
    const cached = getChatsCache();
    if (cached.length > 0) { allChats = cached; renderChatList(); }
  });
}

function renderChatList() {
  if (!chatList) return;
  if (allChats.length === 0) {
    chatList.innerHTML = `<div style="text-align:center; padding:20px; color: var(--text-dim); font-size:12px; opacity:0.5;">
      <i class="fas fa-comment" style="display:block; margin-bottom:8px; font-size:20px;"></i>
      Aucune discussion
    </div>`;
    return;
  }

  let html = '';
  allChats.forEach(chat => {
    const isActive = chat.id === currentChatId ? 'active' : '';
    const name = chat.name || 'Nouvelle discussion';
    html += `<div class="chat-item ${isActive}" data-chatid="${chat.id}">
      <i class="fas fa-comment"></i>
      <span class="chat-name">${escapeHtml(name)}</span>
      <span class="chat-delete" data-chatid="${chat.id}"><i class="fas fa-times"></i></span>
    </div>`;
  });
  chatList.innerHTML = html;

  chatList.querySelectorAll('.chat-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.closest('.chat-delete')) return;
      const chatId = item.dataset.chatid;
      if (chatId) loadChat(chatId);
      closeMenu();
    });
  });

  chatList.querySelectorAll('.chat-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const chatId = btn.dataset.chatid;
      if (chatId && confirm('Supprimer cette discussion ?')) {
        try {
          await deleteDoc(doc(db, 'ia_chats', chatId));
          showToast('Discussion supprimée', 'info');
          if (currentChatId === chatId) {
            currentChatId = null;
            conversationHistory = [];
            messagesContainer.innerHTML = `
              <div class="messages-empty">
                <i class="fas fa-robot"></i>
                <div class="empty-title">Assistant ARVEXA</div>
                <div class="empty-sub">Posez-moi une question, je vous aiderai !</div>
              </div>
            `;
          }
        } catch (error) {
          console.error('Erreur suppression:', error);
          showToast('Erreur lors de la suppression', 'error');
        }
      }
    });
  });
}

async function createNewChat() {
  if (!currentUser) { showToast('Veuillez vous connecter', 'error'); return; }
  try {
    const chatId = 'chat_' + Date.now();
    const newChat = {
      userId: currentUser.uid,
      chatId: chatId,
      name: 'Nouvelle discussion',
      messages: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    await setDoc(doc(db, 'ia_chats', chatId), newChat);
    currentChatId = chatId;
    conversationHistory = [];
    messagesContainer.innerHTML = `
      <div class="messages-empty">
        <i class="fas fa-robot"></i>
        <div class="empty-title">Assistant ARVEXA</div>
        <div class="empty-sub">Posez-moi une question, je vous aiderai !</div>
      </div>
    `;
    closeMenu();
    showToast('Nouvelle discussion créée', 'info');
  } catch (error) {
    console.error('Erreur création:', error);
    showToast('Erreur lors de la création', 'error');
  }
}

async function loadChat(chatId) {
  try {
    const chatRef = doc(db, 'ia_chats', chatId);
    const chatSnap = await getDoc(chatRef);
    if (chatSnap.exists()) {
      const chat = chatSnap.data();
      currentChatId = chatId;
      conversationHistory = [];
      messagesContainer.innerHTML = '';
      (chat.messages || []).forEach(msg => {
        const sender = msg.sender === 'user' ? 'user' : 'ia';
        addMessage(msg.text, sender, msg.time, msg.model ? { model: msg.model, icon: '🤖' } : null);
        if (sender === 'user' || sender === 'ia') {
          conversationHistory.push({ sender, text: msg.text });
        }
      });
      if ((chat.messages || []).length === 0) {
        messagesContainer.innerHTML = `
          <div class="messages-empty">
            <i class="fas fa-robot"></i>
            <div class="empty-title">Assistant ARVEXA</div>
            <div class="empty-sub">Posez-moi une question, je vous aiderai !</div>
          </div>
        `;
      }
      renderChatList();
    }
  } catch (error) {
    console.error('Erreur chargement:', error);
  }
}

function openMenu() {

  sidebarOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  isMenuOpen = true;
}

function closeMenu() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
  document.body.style.overflow = '';
  isMenuOpen = false;
}

menuToggle.addEventListener('click', () => {
  isMenuOpen ? closeMenu() : openMenu();
});

closeSidebar.addEventListener('click', closeMenu);
sidebarOverlay.addEventListener('click', closeMenu);

// ================================================================
// SWIPE POUR LE MENU
// ================================================================
let touchStartX = 0;
let touchStartY = 0;
const SWIPE_THRESHOLD = 40;
const EDGE_THRESHOLD = 20;

document.addEventListener('touchstart', (e) => {
  const touch = e.changedTouches[0];
  touchStartX = touch.screenX;
  touchStartY = touch.screenY;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!e.cancelable) return;
  const touch = e.changedTouches[0];
  const deltaX = touch.screenX - touchStartX;
  const deltaY = touch.screenY - touchStartY;
  
  if (Math.abs(deltaY) > Math.abs(deltaX) * 1.2) return;
  
  if (touchStartX < EDGE_THRESHOLD && deltaX > SWIPE_THRESHOLD && !isMenuOpen) {
    e.preventDefault();
    openMenu();
  }
  
  if (isMenuOpen && deltaX < -SWIPE_THRESHOLD) {
    e.preventDefault();
    closeMenu();
  }
}, { passive: false });

function openConfirmModal() {

  document.body.style.overflow = 'hidden';
}

function closeConfirmModal() {

  document.body.style.overflow = '';
}

cancelConfirmBtn.addEventListener('click', closeConfirmModal);
confirmModal.addEventListener('click', (e) => {
  if (e.target === confirmModal) closeConfirmModal();
});

confirmLogoutBtn.addEventListener('click', async () => {
  try {
    await signOut(auth);
    localStorage.removeItem('ARVEXA_current_user');
    localStorage.removeItem('ARVEXA_user_data');
    sessionStorage.clear();
    closeConfirmModal();
    showToast('✅ Déconnexion réussie', 'success');
    setTimeout(() => { window.location.href = 'login.html'; }, 500);
  } catch (error) {
    console.error('Erreur déconnexion:', error);
    showToast('❌ Erreur lors de la déconnexion', 'error');
    closeConfirmModal();
  }
});

menuLogoutBtn.addEventListener('click', (e) => {

});

});

// ================================================================
// AUTH
// ================================================================
let authChecked = false;
const sessionUid = sessionStorage.getItem('session_uid');

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);

    try {
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists()) {
        userData = userSnap.data();
        localStorage.setItem('ARVEXA_user_data', JSON.stringify(userData));
      }
    } catch (error) {
      console.error('Erreur récupération utilisateur:', error);
    }

    listenChats();
    const cached = getChatsCache();
    if (cached.length > 0 && !currentChatId) {
      const lastChat = cached[0];
      if (lastChat) {
        await loadChat(lastChat.id);
      }
    }

    authChecked = true;
  } else {
    if (!authChecked) {
      const savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(() => {
          if (!auth.currentUser) {
            localStorage.removeItem('ARVEXA_current_user');
            window.location.href = 'login.html';
          }
        }, 2000);
      } else {
        window.location.href = 'login.html';
      }
    }
  }
});
