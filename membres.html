<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Membres du groupe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* ===== ROOT ===== */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --whatsapp-green: #25D366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.08) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    /* ============================================================
       HEADER (STYLE WHATSAPP)
       ============================================================ */
    .chat-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
      flex-shrink: 0;
      gap: 10px;
      min-height: 60px;
      position: relative;
      z-index: 10;
    }

    .chat-header .back-btn {
      width: 36px;
      height: 36px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .chat-header .back-btn:active {
      transform: scale(0.92);
      background: rgba(184, 134, 11, 0.08);
    }
    .chat-header .back-btn i {
      font-size: 16px;
    }

    .chat-header .header-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      color: var(--text-light);
      font-family: 'Playfair Display', serif;
    }
    .chat-header .header-title span {
      color: var(--accent);
      font-style: italic;
    }

    .chat-header .member-count {
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 12px;
      background: var(--glass-bg);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    /* ============================================================
       LISTE DES MEMBRES
       ============================================================ */
    .members-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 20px;
      -webkit-overflow-scrolling: touch;
    }
    .members-container::-webkit-scrollbar {
      width: 3px;
    }
    .members-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .members-container::-webkit-scrollbar-thumb {
      background: rgba(184, 134, 11, 0.2);
      border-radius: 4px;
    }

    /* ===== MEMBER ITEM ===== */
    .member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }
    .member-item:active {
      transform: scale(0.97);
    }
    .member-item:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(184, 134, 11, 0.04);
    }

    .member-item .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--bg-dark);
      flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(184, 134, 11, 0.10);
    }

    .member-item .info {
      flex: 1;
      min-width: 0;
    }
    .member-item .name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
    }
    .member-item .name .badge {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 10px;
      background: rgba(184, 134, 11, 0.10);
      color: var(--accent);
      margin-left: 6px;
    }
    .member-item .sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    .member-item .sub .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .member-item .sub .dot.online {
      background: var(--success);
    }
    .member-item .sub .dot.offline {
      background: var(--text-muted);
      opacity: 0.3;
    }

    .member-item .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(37, 211, 102, 0.10);
      color: var(--whatsapp-green);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .member-item .action-btn:active {
      transform: scale(0.92);
    }
    .member-item .action-btn:hover {
      background: rgba(37, 211, 102, 0.20);
    }

    /* ===== MEMBER ITEM (MOI) ===== */
    .member-item.me {
      background: rgba(184, 134, 11, 0.04);
      border-color: rgba(184, 134, 11, 0.06);
    }
    .member-item.me .name .badge-me {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 10px;
      background: rgba(45, 125, 90, 0.12);
      color: var(--success);
      margin-left: 6px;
    }

    /* ============================================================
       SKELETON
       ============================================================ */
    .skeleton-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 2px;
    }
    .skeleton-item .skeleton-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-item .skeleton-text {
      flex: 1;
    }
    .skeleton-item .skeleton-text .line {
      height: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      margin-bottom: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-item .skeleton-text .line:last-child {
      margin-bottom: 0;
      width: 60%;
    }
    .skeleton-item .skeleton-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 20px;
    }
    .empty-state i {
      font-size: 48px;
      opacity: 0.15;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .empty-state .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .empty-state .sub {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 4px;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 90%;
      width: 400px;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
    .toast.success {
      background: #0D2A1F;
      border: 1px solid #2D7D5A;
      color: #2D7D5A;
    }
    .toast.error {
      background: #2A0D0D;
      border: 1px solid #8A3A3A;
      color: #8A3A3A;
    }
    .toast.warning {
      background: #2A1A0D;
      border: 1px solid #B8860B;
      color: #B8860B;
    }
    .toast.info {
      background: #0D1A2A;
      border: 1px solid #4A7A8A;
      color: #4A7A8A;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .chat-header { padding: 6px 10px; min-height: 54px; }
      .chat-header .header-title { font-size: 15px; }
      .chat-header .member-count { font-size: 10px; padding: 2px 10px; }
      .member-item { padding: 8px 10px; }
      .member-item .avatar { width: 38px; height: 38px; font-size: 14px; }
      .member-item .name { font-size: 13px; }
      .member-item .sub { font-size: 10px; }
      .member-item .action-btn { width: 28px; height: 28px; font-size: 12px; }
    }

    @media (min-width: 768px) {
      .members-container { max-width: 700px; margin: 0 auto; width: 100%; }
      .chat-header { padding: 10px 5%; }
    }
  </style>
</head>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",

<script type="module">
// ================================================================
// IMPORTS
// ================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { 
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  orderBy,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// ================================================================
// CONFIGURATION FIREBASE
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBEbYuuUlNCLMBUHClv4UnyownNHw2q3_g",
  authDomain: "nexgen-39043.firebaseapp.com",
  projectId: "nexgen-39043",
  storageBucket: "nexgen-39043.firebasestorage.app",
  messagingSenderId: "619390144325",
  appId: "1:619390144325:web:35d96b125501e4e8b1782c",
  measurementId: "G-HC2Q5DNKDR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence);

// ================================================================
// DOM
// ================================================================
const membersContainer = document.getElementById('membersContainer');
const memberCount = document.getElementById('memberCount');
const toast = document.getElementById('toast');

let currentUser = null;
let userData = null;
let unsubscribeMembers = null;
let isPageLoading = true;
let notificationTimeout = null;

// ================================================================
// GESTION DU CACHE
// ================================================================
function getCachedUserData() {
  try {
    const cached = localStorage.getItem('ARVEXA_user_data');
    const timestamp = localStorage.getItem('ARVEXA_user_data_timestamp');
    if (!cached) return null;
    if (timestamp) {
      const age = Date.now() - parseInt(timestamp);
      if (age > 300000) return null;
    }
    return JSON.parse(cached);
  } catch(e) { return null; }
}

function setCachedUserData(data) {
  localStorage.setItem('ARVEXA_user_data', JSON.stringify(data));
  localStorage.setItem('ARVEXA_user_data_timestamp', String(Date.now()));
}

function loadFromCache() {
  const cached = getCachedUserData();
  if (cached) {
    userData = cached;
    return true;
  }
  return false;
}

// ================================================================
// TOAST
// ================================================================
function showToast(message, type = 'info') {
  toast.textContent = message;
  toast.className = 'toast ' + type;
  clearTimeout(notificationTimeout);
  requestAnimationFrame(() => toast.classList.add('show'));
  notificationTimeout = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ================================================================
// HELPERS
// ================================================================
function getInitials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ================================================================
// CHARGER LES MEMBRES
// ================================================================
function loadMembers() {
  if (unsubscribeMembers) {
    unsubscribeMembers();
    unsubscribeMembers = null;
  }

  // Écouter les changements en temps réel
  const usersRef = collection(db, 'users');
  
  unsubscribeMembers = onSnapshot(usersRef, (snapshot) => {
    const members = [];
    snapshot.forEach((doc) => {
      const data = doc.data();
      data.uid = doc.id;
      members.push(data);
    });
    
    // Trier par date d'inscription (les plus récents d'abord)
    members.sort((a, b) => {
      const dateA = a.createdAt || a.registrationDate || '';
      const dateB = b.createdAt || b.registrationDate || '';
      return dateB.localeCompare(dateA);
    });
    
    renderMembers(members);
    
  }, (error) => {
    console.error('Erreur chargement membres:', error);
    showToast('❌ Erreur de chargement', 'error');
    
    // Fallback: chargement unique
    loadMembersOnce();
  });
}

// ================================================================
// CHARGEMENT UNIQUE (FALLBACK)
// ================================================================
async function loadMembersOnce() {
  try {
    const usersRef = collection(db, 'users');
    const snapshot = await getDocs(usersRef);
    const members = [];
    snapshot.forEach((doc) => {
      const data = doc.data();
      data.uid = doc.id;
      members.push(data);
    });
    members.sort((a, b) => {
      const dateA = a.createdAt || a.registrationDate || '';
      const dateB = b.createdAt || b.registrationDate || '';
      return dateB.localeCompare(dateA);
    });
    renderMembers(members);
  } catch (error) {
    console.error('Erreur fallback:', error);
    membersContainer.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-users"></i>
        <div class="title">Erreur de chargement</div>
        <div class="sub">Veuillez réessayer plus tard</div>
      </div>
    `;
    memberCount.textContent = '0';
  }
}


// ================================================================
// AFFICHER LES MEMBRES
// ================================================================
function renderMembers(members) {
  if (!members || members.length === 0) {
    membersContainer.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-users"></i>
        <div class="title">Aucun membre</div>
        <div class="sub">Le groupe est vide pour le moment</div>
      </div>
    `;
    memberCount.textContent = '0';
    return;
  }

  memberCount.textContent = members.length;

  let html = '';
  members.forEach((member) => {
    const isMe = currentUser && member.uid === currentUser.uid;
    const name = member.prenom || member.fullName || member.nom || 'Utilisateur';
    const initial = getInitials(name);
    const avatarUrl = member.avatarBase64 || '';
    const isPremium = member.isUnlocked === true || member.hasDeposited === true;
    
    const avatarStyle = avatarUrl ? `background-image:url('${avatarUrl}');background-size:cover;` : '';
    const meClass = isMe ? 'me' : '';
    const badgeMe = isMe ? '<span class="badge-me">● Moi</span>' : '';
    const badgePremium = isPremium && !isMe ? '<span class="badge">⭐ Premium</span>' : '';
    
    // Statut en ligne (simulé)
    const isOnline = false; // À améliorer avec un système de présence
    const dotClass = isOnline ? 'online' : 'offline';
    const statusText = isOnline ? 'En ligne' : 'Hors ligne';
    
    html += `
      <div class="member-item ${meClass}" data-uid="${member.uid}" data-name="${escapeHtml(name)}" data-avatar="${escapeHtml(avatarUrl)}">
        <div class="avatar" style="${avatarStyle}">${avatarStyle ? '' : initial}</div>
        <div class="info">
          <div class="name">
            ${escapeHtml(name)}
            ${badgeMe}
            ${badgePremium}
          </div>
          <div class="sub">
            <span class="dot ${dotClass}"></span> ${statusText}
          </div>
        </div>
        ${!isMe ? `
          <button class="action-btn" data-uid="${member.uid}" data-name="${escapeHtml(name)}" title="Discuter en privé">
            <i class="fas fa-comment"></i>
          </button>
        ` : `
          <button class="action-btn" style="background:transparent;color:var(--text-muted);cursor:default;pointer-events:none;" title="C'est vous">
            <i class="fas fa-user-check"></i>
          </button>
        `}
      </div>
    `;
  });

  membersContainer.innerHTML = html;

  // Événements pour les boutons de discussion privée
  document.querySelectorAll('.member-item .action-btn[data-uid]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const uid = btn.dataset.uid;
      const name = btn.dataset.name;
      if (uid && name) {
        startPrivateChat(uid, name);
      }
    });
  });

  // Événements sur l'ensemble de l'élément membre
  document.querySelectorAll('.member-item').forEach((item) => {
    item.addEventListener('click', () => {
      const uid = item.dataset.uid;
      const name = item.dataset.name;
      const avatar = item.dataset.avatar;
      if (uid && name && !item.classList.contains('me')) {
        startPrivateChat(uid, name, avatar);
      }
    });
  });
}

// ================================================================
// DÉMARRER UNE DISCUSSION PRIVÉE
// ================================================================
function startPrivateChat(targetUid, targetName, targetAvatar) {
  if (!currentUser) {
    showToast('⚠️ Veuillez vous connecter', 'warning');
    return;
  }
  
  if (targetUid === currentUser.uid) {
    showToast('C\'est vous !', 'info');
    return;
  }
  
  // Rediriger vers la page de discussion privée
  const params = new URLSearchParams();
  params.set('uid', targetUid);
  params.set('name', encodeURIComponent(targetName));
  if (targetAvatar) {
    params.set('avatar', encodeURIComponent(targetAvatar));
  }
  
  window.location.href = 'discussion.html?' + params.toString();
}

// ================================================================
// CHARGER UTILISATEUR
// ================================================================
async function loadUserData(uid) {
  try {
    const userRef = doc(db, 'users', uid);
    const docSnap = await getDoc(userRef);
    if (docSnap.exists()) {
      userData = docSnap.data();
      setCachedUserData(userData);
      return userData;
    }
    return null;
  } catch (error) {
    console.error('Erreur chargement user:', error);
    return null;
  }
}

// ================================================================
// CACHE POUR RETOUR ARRIÈRE INSTANTANÉ
// ================================================================
window.addEventListener('pageshow', (event) => {
  if (event.persisted) {
    console.debug('📱 Page membres chargée depuis le cache');
    loadFromCache();
    if (currentUser) {
      loadMembers();
    }
  }
});

// ================================================================
// AUTH
// ================================================================
const sessionUid = sessionStorage.getItem('session_uid');

loadFromCache();

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);
    
    if (sessionUid === user.uid) {
      console.debug("✅ Session déjà validée, chargement rapide");
      loadUserData(user.uid).then(() => {
        loadMembers();
      });
      isPageLoading = false;
      return;
    }

    loadUserData(user.uid).then(() => {
      loadMembers();
    });
    isPageLoading = false;
  } else {
    if (isPageLoading) {
      setTimeout(() => {
        if (!auth.currentUser) {
          const savedUid = localStorage.getItem('ARVEXA_current_user');
          if (savedUid) {
            if (!auth.currentUser) {
              window.location.href = 'login.html';
            }
          } else {
            window.location.href = 'login.html';
          }
        }
      }, 3000);
    } else {
      const savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(() => {
          if (!auth.currentUser) {
            window.location.href = 'login.html';
          }
        }, 2000);
      } else {
        window.location.href = 'login.html';
      }
    }
  }
});

console.debug('👥 ARVEXA - Membres du groupe (v1.0)');
console.debug('✅ Liste des membres en temps réel');
console.debug('✅ Bouton 💬 pour discuter en privé');
console.debug('✅ Statut premium affiché');
</script>
