    /* ===== ROOT ===== */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;

      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --whatsapp-green: #25D366;
      --whatsapp-bubble-other: rgba(255, 255, 255, 0.05);
      --whatsapp-bubble-me: rgba(184, 134, 11, 0.15);
      --header-height: 60px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased;
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.08) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .chat-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
      flex-shrink: 0;
      gap: 10px;
      min-height: var(--header-height);
      position: relative;
      z-index: 10;
    }

    .chat-header .back-btn {
      width: 36px;
      height: 36px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .chat-header .back-btn:active {
      transform: scale(0.92);
      background: rgba(184, 134, 11, 0.08);
    }
    .chat-header .back-btn i { font-size: 16px; }

    .chat-header .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--bg-dark);
      flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(184, 134, 11, 0.15);
    }

    .chat-header .user-info {
      flex: 1;
      min-width: 0;
    }
    .chat-header .user-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-light);
      line-height: 1.2;
    }
    .chat-header .user-status {
      font-size: 11px;
      color: var(--text-muted);
    }
    .chat-header .user-status .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .chat-header .user-status .dot.online {
      background: var(--success);
    }
    .chat-header .user-status .dot.offline {
      background: var(--text-muted);
      opacity: 0.3;
    }

    .chat-header .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .chat-header .header-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .chat-header .header-btn:active { transform: scale(0.92); }
    .chat-header .header-btn:hover { color: var(--text-light); }

    /* ============================================================
       CHAT CONTAINER
       ============================================================ */
    .chat-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 0 0;
      width: 100%;
      overflow: hidden;
    }

    /* ============================================================
       MESSAGES
       ============================================================ */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;

    }
    .messages-container::-webkit-scrollbar {

    }
    .messages-container::-webkit-scrollbar-track {

    }
    .messages-container::-webkit-scrollbar-thumb {

      max-width: 82%;

    .message-wrapper.me { align-self: flex-end; }

      to { opacity: 1; transform: translateY(0) scale(1); }

      justify-content: center;
      font-size: 8px;
      font-weight: 600;
      color: var(--bg-dark);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;

    .message-wrapper.me .message-sender { display: none; }

      border-bottom-left-radius: 4px;
    }
    .message-wrapper.me .message-bubble {
      background: var(--whatsapp-bubble-me);
      border-color: rgba(184, 134, 11, 0.10);
      border-bottom-right-radius: 4px;
    }

    .message-bubble .msg-time {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
      text-align: right;
      opacity: 0.6;
    }
    .message-wrapper.me .message-bubble .msg-time {
      color: var(--accent);
    }

    .message-bubble .msg-image {
      max-width: 220px;
      max-height: 300px;
      border-radius: 12px;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .message-bubble .msg-image:active { transform: scale(0.97); }

    .messages-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 20px;
    }
    .messages-empty i {
      font-size: 48px;
      opacity: 0.15;
      margin-bottom: 12px;
      color: var(--accent);

    .messages-empty .empty-title {

      color: var(--text-dim);
    }
    .messages-empty .empty-sub {

      opacity: 0.6;

    /* ============================================================

       ============================================================ */
    .chat-input-wrapper {

      padding: 6px 12px 10px;

      border-top: 1px solid rgba(184, 134, 11, 0.04);

      font-size: 14px;

      max-height: 100px;
      line-height: 1.5;
      overflow-y: auto;

      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .chat-input-area .btn-attach {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .chat-input-area .btn-attach:active { transform: scale(0.92); }
    .chat-input-area .btn-attach:hover { color: var(--text-light); }

    .chat-input-area .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--bg-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .chat-input-area .btn-send:active { transform: scale(0.92); }
    .chat-input-area .btn-send:hover {
      background: #9A7209;
      box-shadow: 0 0 20px rgba(184, 134, 11, 0.15);
    }
    .chat-input-area .btn-send:disabled {
      opacity: 0.3;
      cursor: not-allowed;

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 90%;
      width: 400px;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }
    .toast.hide {
      transform: translateX(-50%) translateY(120px);
      opacity: 0;
      visibility: hidden;
    }
    .toast.success {
      background: #0D2A1F;
      border: 1px solid #2D7D5A;
      color: #2D7D5A;
    }
    .toast.error {
      background: #2A0D0D;
      border: 1px solid #8A3A3A;
      color: #8A3A3A;
    }
    .toast.warning {
      background: #2A1A0D;
      border: 1px solid #B8860B;
      color: #B8860B;
    }
    .toast.info {
      background: #0D1A2A;
      border: 1px solid #4A7A8A;
      color: #4A7A8A;
    }

       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {

      .chat-header { padding: 6px 10px; min-height: var(--header-height); }
      .chat-header .user-avatar { width: 34px; height: 34px; font-size: 14px; }
      .chat-header .user-name { font-size: 14px; }
      .chat-header .user-status { font-size: 10px; }
      .chat-header .header-btn { width: 32px; height: 32px; font-size: 16px; }
      .chat-header .back-btn { width: 32px; height: 32px; }
      .message-bubble { font-size: 13px; padding: 6px 12px; }
      .message-bubble .msg-image { max-width: 160px; max-height: 220px; }
      .messages-container { padding: 8px 10px 4px; }
      .chat-input-wrapper { padding: 4px 8px 8px; }
      .chat-input-area { padding: 2px 2px 2px 12px; border-radius: 20px; }
      .chat-input-area textarea { font-size: 13px; padding: 6px 0; min-height: 18px; }
      .chat-input-area .btn-send { width: 32px; height: 32px; font-size: 14px; }
      .chat-input-area .btn-attach { width: 28px; height: 28px; font-size: 16px; }
      .toast { bottom: 70px; padding: 10px 14px; font-size: 12px; max-width: 92%; }
    }

    @media (min-width: 768px) {
      .messages-container { max-width: 700px; margin: 0 auto; width: 100%; }
      .chat-input-wrapper { max-width: 700px; margin: 0 auto; width: 100%; }
    }
  </style>
</head>

// ================================================================
// TOAST
// ================================================================
function showToast(message, type = 'info') {
  if (toastTimer) {
    clearTimeout(toastTimer);
    toastTimer = null;
  }
  toast.classList.remove('show', 'hide');
  void toast.offsetWidth;
  toast.textContent = message;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => toast.classList.add('show'));
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
    toast.classList.add('hide');
    toastTimer = null;
  }, 3500);
  toast.onclick = () => {
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    toast.classList.remove('show');
    toast.classList.add('hide');
  };
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getInitials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

// ================================================================
// COMPRESSER L'IMAGE
// ================================================================
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject('Le fichier n\'est pas une image');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      reject('L\'image est trop lourde (max 10MB)');
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 800;
        let width = img.width;
        let height = img.height;
        if (width > maxSize || height > maxSize) {
          if (width > height) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const quality = 0.7;
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve(base64);
      };
      img.onerror = () => reject('Erreur de chargement de l\'image');
      img.src = event.target.result;
    };
    reader.onerror = () => reject('Erreur de lecture du fichier');
    reader.readAsDataURL(file);
  });
}

    const userRef = doc(db, 'users', uid);
    await updateDoc(userRef, {
      online: status,
      lastSeen: new Date().toISOString()
    });
  } catch (error) {
    console.warn('⚠️ Erreur mise à jour statut:', error);
  }
}

// ================================================================
// CHARGER LES INFORMATIONS DE LA CIBLE
// ================================================================
async function loadTargetUser(uid) {
  try {
    const userRef = doc(db, 'users', uid);
    const docSnap = await getDoc(userRef);
    if (docSnap.exists()) {
      targetUser = docSnap.data();
      targetUser.uid = uid;
      updateHeader(targetUser);
      
      // ✅ Écouter les changements de statut de la cible
      if (unsubscribeTarget) {
        unsubscribeTarget();
        unsubscribeTarget = null;
      }
      
      unsubscribeTarget = onSnapshot(userRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          targetUser = { ...targetUser, ...data };
          updateHeader(targetUser);
        }
      });
      
      return targetUser;
    } else {
      showToast('❌ Utilisateur introuvable', 'error');
      setTimeout(() => {
        window.location.href = 'membres.html';
      }, 1500);
      return null;
    }
  } catch (error) {
    console.error('Erreur chargement cible:', error);
    showToast('❌ Erreur de chargement', 'error');
    return null;
  }
}

// ================================================================
// METTRE À JOUR L'EN-TÊTE
// ================================================================
function updateHeader(user) {
  if (!user) return;
  
  const name = user.prenom || user.fullName || user.nom || 'Utilisateur';
  const initial = getInitials(name);
  const avatarUrl = user.avatarBase64 || '';
  
  userName.textContent = name;
  
  if (avatarUrl) {
    userAvatar.style.backgroundImage = `url('${avatarUrl}')`;
    userAvatar.style.backgroundSize = 'cover';
    userAvatar.textContent = '';
  } else {
    userAvatar.style.backgroundImage = 'none';
    userAvatar.textContent = initial;
  }
  
  // ✅ Statut en ligne (basé sur Firestore)
  const isOnline = user.online === true;
  const dotClass = isOnline ? 'online' : 'offline';
  const statusText = isOnline ? 'En ligne' : 'Hors ligne';
  userStatus.innerHTML = `<span class="dot ${dotClass}"></span> ${statusText}`;
}

// ================================================================
// ÉCOUTER LES MESSAGES PRIVÉS - SANS INDEX (FALLBACK)
// ================================================================
function listenPrivateMessages(convId) {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }
  
  if (!convId) return;
  
  // ✅ Requête SANS orderBy (pour éviter l'erreur d'index)
  const q = query(
    collection(db, 'messages_prives'),
    where('conversationId', '==', convId)
  );
  
  let isFirstLoad = true;
  
  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    const messages = [];
    snapshot.forEach((doc) => {
      messages.push({ id: doc.id, ...doc.data() });
    });
    
    // ✅ Tri en mémoire (côté client)
    messages.sort((a, b) => {
      const dateA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
      const dateB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
      return dateA - dateB;
    });
    
    renderMessages(messages);
    
    if (isFirstLoad) {
      isFirstLoad = false;
      scrollToBottom();
    } else {
      const isNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;
      if (isNearBottom) scrollToBottom();
    }
    
  }, (error) => {
    console.error('Erreur écoute messages privés:', error);
    showToast('❌ Erreur de chargement des messages', 'error');
  });
}

// ================================================================
// AFFICHER LES MESSAGES
// ================================================================
function renderMessages(messages) {
  if (!messages || messages.length === 0) {
    messagesContainer.innerHTML = `
      <div class="messages-empty">
        <i class="fas fa-comment-dots"></i>
        <div class="empty-title">Aucun message</div>
        <div class="empty-sub">Commencez la discussion !</div>
      </div>
    `;
    return;
  }
  
  let html = '';
  let lastDate = '';
  
  messages.forEach((msg, index) => {
    const isMe = currentUser && msg.userId === currentUser.uid;
    const msgTime = formatTime(msg.timestamp);
    const senderName = msg.userName || 'Utilisateur';
    const avatarUrl = msg.userAvatar || '';
    const initial = getInitials(senderName);
    
    const isImage = msg.type === 'image' || (msg.message && msg.message.startsWith('data:image'));
    const avatarStyle = avatarUrl ? `background-image:url('${avatarUrl}');background-size:cover;` : '';
    
    let contentHtml = '';
    if (isImage) {
      contentHtml = `
        <img src="${escapeHtml(msg.message)}" class="msg-image" loading="lazy" 
             onclick="window.open('${escapeHtml(msg.message)}', '_blank')"
             alt="Image partagée">
      `;
    } else {
      contentHtml = escapeHtml(msg.message);
    }
    
    html += `
      <div class="message-wrapper ${isMe ? 'me' : 'other'}">
        ${!isMe ? `
        <div class="message-sender">
          <div class="avatar-small" style="${avatarStyle}">${avatarStyle ? '' : initial}</div>
          <span>${escapeHtml(senderName)}</span>
        </div>
        ` : ''}
        <div class="message-bubble">
          ${contentHtml}
          <span class="msg-time">${msgTime}</span>
        </div>
      </div>
    `;
  });
  
  messagesContainer.innerHTML = html;
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  });
}

// ================================================================
// ENVOYER UN MESSAGE PRIVÉ (TEXTE)
// ================================================================
async function sendPrivateMessage(text) {
  if (!text || !currentUser || !targetUid || !conversationId || isSending) return;
  
  isSending = true;
  sendBtn.disabled = true;
  
  const userName = userData?.prenom || userData?.fullName || 'Utilisateur';
  const avatarBase64 = userData?.avatarBase64 || '';
  
  try {
    const messageData = {
      conversationId: conversationId,
      userId: currentUser.uid,
      userName: userName,
      userAvatar: avatarBase64,
      targetId: targetUid,
      message: text,
      type: 'text',
      timestamp: new Date().toISOString()
    };
    
    await addDoc(collection(db, 'messages_prives'), messageData);
    
    messageInput.value = '';
    messageInput.style.height = 'auto';
    messageInput.focus();
    
  } catch (error) {
    console.error('Erreur envoi message:', error);
    showToast('❌ Erreur lors de l\'envoi', 'error');
  }
  
  isSending = false;
  sendBtn.disabled = false;
}

// ================================================================
// ENVOYER UNE IMAGE
// ================================================================
async function sendImage(base64Image) {
  if (!base64Image || !currentUser || !targetUid || !conversationId || isSending) return;
  
  isSending = true;
  sendBtn.disabled = true;
  
  const userName = userData?.prenom || userData?.fullName || 'Utilisateur';
  const avatarBase64 = userData?.avatarBase64 || '';
  
  try {
    const messageData = {
      conversationId: conversationId,
      userId: currentUser.uid,
      userName: userName,
      userAvatar: avatarBase64,
      targetId: targetUid,
      message: base64Image,
      type: 'image',
      timestamp: new Date().toISOString()
    };
    
    await addDoc(collection(db, 'messages_prives'), messageData);
    showToast('✅ Image envoyée', 'success');
  } catch (error) {
    console.error('Erreur envoi image:', error);
    showToast('❌ Erreur lors de l\'envoi de l\'image', 'error');
  }
  
  isSending = false;
  sendBtn.disabled = false;
}

// ================================================================
// ÉVÉNEMENTS
// ================================================================
messageInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (text) {
      sendPrivateMessage(text);
      messageInput.value = '';
      messageInput.style.height = 'auto';
    }
  }
});

sendBtn.addEventListener('click', () => {
  const text = messageInput.value.trim();
  if (text) {
    sendPrivateMessage(text);
    messageInput.value = '';
    messageInput.style.height = 'auto';
  }
});

attachBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showToast('📤 Compression de l\'image...', 'info');
  try {
    const base64 = await compressImage(file);
    await sendImage(base64);
  } catch (error) {
    showToast('❌ ' + error, 'error');
  }
  imageInput.value = '';
});

backBtn.addEventListener('click', () => {
  window.location.href = 'membres.html';
});

refreshBtn.addEventListener('click', () => {

    listenPrivateMessages(conversationId);
  }
});

// ================================================================
// INITIALISER LA PAGE
// ================================================================
function initPage() {
  const urlParams = new URLSearchParams(window.location.search);
  const uid = urlParams.get('uid');
  const name = decodeURIComponent(urlParams.get('name') || '');
  const avatar = decodeURIComponent(urlParams.get('avatar') || '');
  
  if (!uid) {
    showToast('❌ Aucun utilisateur sélectionné', 'error');
    setTimeout(() => {
      window.location.href = 'membres.html';
    }, 1500);
    return;
  }
  
  targetUid = uid;
  
  if (name) {
    userName.textContent = name;
  }
  if (avatar) {
    userAvatar.style.backgroundImage = `url('${avatar}')`;
    userAvatar.style.backgroundSize = 'cover';
    userAvatar.textContent = '';
  }
  
  if (currentUser) {
    loadTargetUser(uid).then(() => {
      if (currentUser && targetUid) {
        conversationId = generateConversationId(currentUser.uid, targetUid);
        listenPrivateMessages(conversationId);
      }
    });
  }
}

// ================================================================
// CHARGER UTILISATEUR
// ================================================================
async function loadUserData(uid) {
  try {
    const userRef = doc(db, 'users', uid);
    const docSnap = await getDoc(userRef);
    if (docSnap.exists()) {
      userData = docSnap.data();
      localStorage.setItem('ARVEXA_user_data', JSON.stringify(userData));
      return userData;
    }
    return null;
  } catch (error) {
    console.error('Erreur chargement user:', error);
    return null;
  }
}

// ================================================================
// CACHE
// ================================================================
function loadFromCache() {
  try {
    const cached = localStorage.getItem('ARVEXA_user_data');
    if (cached) {
      userData = JSON.parse(cached);
      return true;
    }
  } catch(e) {}
  return false;
}

// ================================================================
// INITIALISATION
// ================================================================
async function initDiscussion() {
  if (!currentUser) return;
  
  await loadUserData(currentUser.uid);
  
  // ✅ Mettre le statut en ligne
  await setUserOnline(currentUser.uid, true);
  
  initPage();
}

// ================================================================
// AUTH
// ================================================================
const sessionUid = sessionStorage.getItem('session_uid');
loadFromCache();

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);
    
    // ✅ Mettre le statut en ligne
    await setUserOnline(user.uid, true);
    
    if (sessionUid === user.uid) {
      console.debug("✅ Session déjà validée, chargement rapide");
      initDiscussion();
      isPageLoading = false;
      return;
    }
    
    initDiscussion();
    isPageLoading = false;
  } else {
    // ✅ Mettre le statut hors ligne avant de rediriger
    const savedUid = localStorage.getItem('ARVEXA_current_user');
    if (savedUid) {
      await setUserOnline(savedUid, false);
    }
    
    if (isPageLoading) {
      setTimeout(() => {
        if (!auth.currentUser) {
          const savedUid = localStorage.getItem('ARVEXA_current_user');
          if (savedUid) {
            if (!auth.currentUser) window.location.href = 'login.html';
          } else {
            window.location.href = 'login.html';
          }
        }
      }, 3000);
    } else {
      const savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(() => {
          if (!auth.currentUser) window.location.href = 'login.html';
        }, 2000);
      } else {
        window.location.href = 'login.html';
      }
    }
  }
});
